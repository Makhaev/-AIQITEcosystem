name: aiq-core
services:
  db:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: aiq
      POSTGRES_USER: aiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U aiq -d aiq']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgres://aiq:${POSTGRES_PASSWORD}@db:5432/aiq?sslmode=disable
      HTTP_ADDR: :8080
      APP_ORIGIN: https://${AIQ_DOMAIN:?Set AIQ_DOMAIN}
      TRUST_PROXY: 'true'
      FEATURE_STUDENT360: ${FEATURE_STUDENT360:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/health/ready']
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  frontend:
    build: ../frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    environment:
      AIQ_DOMAIN: ${AIQ_DOMAIN:?Set AIQ_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
  admin:
    build: ../backend
    profiles: [maintenance]
    entrypoint: [/app/admin]
    environment:
      DATABASE_URL: postgres://aiq:${POSTGRES_PASSWORD}@db:5432/aiq?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
volumes:
  # Same project/volume name as the original Compose; do not delete or rename it.
  postgres_data:
  caddy_data:
  caddy_config:
