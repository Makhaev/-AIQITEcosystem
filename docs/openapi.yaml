      allOf:
        - { $ref: '#/components/schemas/StudentIdentity' }
        - type: object
          required: [full_access, enrollments, upcoming_lessons, attendance]
          properties:
            education: { $ref: '#/components/schemas/StudentEducation' }
            full_access: { type: boolean }
            enrollments:
              type: array
              items:
                type: object
                required: [id, group_id, group_name, group_status, program_id, program_name, teacher_id, teacher_name, starts_on, ends_on]
                properties:
                  id: { type: integer, format: int64 }
