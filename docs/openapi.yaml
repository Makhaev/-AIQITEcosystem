        - initialized_at
        - has_marks
        - items
      properties:
        lesson_id:
          type: integer
          format: int64
          minimum: 1
        lesson_date:
          type: string
          format: date
        initialized_at:
          type: string
          format: date-time
        has_marks:
          type: boolean
          description: Есть внесённые отметки, включая исключённых учеников; отмена запрещена.
        items:
          type: array
          items:
            $ref: '#/components/schemas/JournalEntry'
    LessonRosterUpdate:
      type: object
      additionalProperties: false
      required:
        - enrollment_ids
        - reason
      properties:
        enrollment_ids:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
          description: Зачисления этой группы; пустой массив исключает всех.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    LessonAttendanceUpdate:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - student_id
              - status
            properties:
              student_id:
                type: integer
                format: int64
                minimum: 1
              status:
                type: string
                enum:
                  - unmarked
                  - present
                  - absent
                  - excused
                  - late
              comment:
                type: string
                nullable: true
                maxLength: 500
    Group:
      type: object
      required: [id, name, program_id, program_name, teacher_id, teacher_name, capacity, status, active_count, created_at, updated_at]
