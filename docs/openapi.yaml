          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
      description: >-
        Модуль должен принадлежать программе группы. После сохранения журнала запрещены смена группы и московской даты начала. Восстановление
        cancelled повторно проверяет конфликты.
  /lessons/{id}/attendance:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      summary: Сохранить при первом открытии и прочитать состав журнала
      description: >-
        Аутентифицированное идемпотентное создание снимка на московскую дату занятия; сохраняется и пустой состав. Последующие изменения
        группы его не меняют. Куратор видит только своих учеников.
      responses:
        '200':
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonJournal'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    put:
      summary: Отметить посещаемость (admin или собственный педагог)
      security:
        - session: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonAttendanceUpdate'
      responses:
        '204':
          description: Успешно.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
      description: >-
        После начала занятия, только ученики сохранённого включённого состава. Для completed — только admin; cancelled не принимает новых
        отметок.
  /lessons/{id}/roster:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      summary: Исправить состав журнала с причиной (admin)
      security:
        - session: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonRosterUpdate'
      responses:
        '200':
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonJournal'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
      description: >-
        Атомарное изменение и audit с автором, временем, reason, before и after. Исключение не удаляет отметки; повторное включение возвращает
        прежние статус и комментарий.
  /lessons/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      summary: Статус completed (admin)
      security:
        - session: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
  /lessons/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      summary: Статус cancelled с сохранением журнала (admin)
      security:
        - session: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: aiq_session }
    csrfCookie: { type: apiKey, in: cookie, name: aiq_csrf }
    csrfHeader: { type: apiKey, in: header, name: X-CSRF-Token }
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, format: uri }
      description: Должен точно совпадать с APP_ORIGIN; браузер устанавливает автоматически.
  schemas:
    Lesson:
      type: object
      additionalProperties: false
      required:
        - id
        - group_id
        - module_id
        - topic
        - teacher_id
        - starts_at
        - ends_at
        - location
        - status
        - group_name
        - program_id
        - module_name
        - teacher_name
        - teacher_user_id
        - roster_initialized_at
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        group_id:
          type: integer
          format: int64
          minimum: 1
        module_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        topic:
          type: string
          minLength: 1
          maxLength: 200
        teacher_id:
          type: integer
          format: int64
          minimum: 1
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          description: Строго позже начала; вход в RFC3339 с часовым поясом.
        location:
          type: string
          maxLength: 500
        status:
          type: string
          enum:
            - scheduled
            - completed
            - cancelled
        group_name:
          type: string
        program_id:
          type: integer
          format: int64
          minimum: 1
        module_name:
          type: string
          nullable: true
        teacher_name:
          type: string
        teacher_user_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        roster_initialized_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LessonCreate:
      type: object
      additionalProperties: false
      required:
        - group_id
        - topic
        - teacher_id
        - starts_at
        - ends_at
      properties:
        group_id:
          type: integer
          format: int64
          minimum: 1
        module_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        topic:
          type: string
          minLength: 1
          maxLength: 200
        teacher_id:
          type: integer
          format: int64
          minimum: 1
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          description: Строго позже начала; вход в RFC3339 с часовым поясом.
        location:
          type: string
          maxLength: 500
        status:
          type: string
          enum:
            - scheduled
            - completed
            - cancelled
          default: scheduled
    LessonUpdate:
      type: object
      additionalProperties: false
      properties:
        group_id:
          type: integer
          format: int64
          minimum: 1
        module_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        topic:
          type: string
          minLength: 1
          maxLength: 200
        teacher_id:
          type: integer
          format: int64
          minimum: 1
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          description: Строго позже начала; вход в RFC3339 с часовым поясом.
        location:
          type: string
          maxLength: 500
          nullable: true
        status:
          type: string
          enum:
            - scheduled
            - completed
            - cancelled
      minProperties: 1
    LessonPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    JournalEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - enrollment_id
        - student_id
        - name
        - status
        - comment
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        enrollment_id:
          type: integer
          format: int64
          minimum: 1
        student_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        status:
          type: string
          enum:
            - unmarked
            - present
            - absent
            - excused
            - late
        comment:
          type: string
          maxLength: 500
    LessonJournal:
      type: object
      additionalProperties: false
      required:
        - lesson_id
        - lesson_date
        - initialized_at
        - items
      properties:
        lesson_id:
          type: integer
          format: int64
          minimum: 1
        lesson_date:
          type: string
          format: date
        initialized_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/JournalEntry'
    LessonRosterUpdate:
      type: object
      additionalProperties: false
      required:
        - enrollment_ids
        - reason
      properties:
        enrollment_ids:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
          description: Зачисления этой группы; пустой массив исключает всех.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    LessonAttendanceUpdate:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - student_id
              - status
            properties:
              student_id:
                type: integer
                format: int64
                minimum: 1
              status:
                type: string
                enum:
                  - unmarked
                  - present
                  - absent
                  - excused
                  - late
              comment:
                type: string
                maxLength: 500
    Group:
      type: object
      required: [id, name, program_id, program_name, teacher_id, teacher_name, capacity, status, active_count, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        program_id: { type: integer, format: int64 }
        program_name: { type: string }
        teacher_id: { type: integer, format: int64, nullable: true }
        teacher_name: { type: string, nullable: true }
        capacity: { type: integer, minimum: 1, maximum: 2147483647 }
        status: { type: string, enum: [draft, active, archived] }
        active_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GroupEnrollment:
      type: object
      required: [id, group_id, student_id, student_name, starts_on, ends_on, created_at]
      properties:
        id: { type: integer, format: int64 }
        group_id: { type: integer, format: int64 }
        student_id: { type: integer, format: int64 }
        student_name: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time }
    GroupCard:
      allOf:
        - { $ref: '#/components/schemas/Group' }
        - type: object
          required: [enrollments]
          properties:
            enrollments: { type: array, items: { $ref: '#/components/schemas/GroupEnrollment' } }
    GroupPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Group' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
    GroupCreate:
      type: object
      additionalProperties: false
      required: [name, program_id, capacity]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        program_id: { type: integer, format: int64, minimum: 1 }
        teacher_id: { type: integer, format: int64, minimum: 1, nullable: true }
        capacity: { type: integer, minimum: 1, maximum: 2147483647 }
        status: { type: string, enum: [draft, active, archived], default: draft }
    GroupUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        program_id: { type: integer, format: int64, minimum: 1 }
        teacher_id: { type: integer, format: int64, minimum: 1, nullable: true }
        capacity: { type: integer, minimum: 1, maximum: 2147483647 }
        status: { type: string, enum: [draft, active, archived] }
    Program:
      type: object
      required:
        - id
        - name
        - description
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        status:
          type: string
          enum:
            - draft
            - active
            - archived
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProgramModule:
      type: object
      required:
        - id
        - program_id
        - name
        - description
        - position
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        program_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        position:
          type: integer
          minimum: 1
          maximum: 2147483647
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProgramCard:
      allOf:
        - $ref: '#/components/schemas/Program'
        - type: object
          required:
            - modules
          properties:
            modules:
              type: array
              items:
                $ref: '#/components/schemas/ProgramModule'
              description: Сортировка по position, затем ID. Номера уникальны внутри программы; пробелы в нумерации допустимы.
    ProgramCreate:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        status:
          type: string
          enum:
            - draft
            - active
            - archived
          default: draft
    ProgramUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          nullable: true
        status:
          type: string
          enum:
            - draft
            - active
            - archived
      minProperties: 1
      description: >-
        Непереданные поля сохраняются. description=null очищает описание. Название и статус не могут быть null. Архивирование сохраняет модули и
        историю групп.
    ModuleCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - position
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        position:
          type: integer
          minimum: 1
          maximum: 2147483647
    ModuleUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          nullable: true
        position:
          type: integer
          minimum: 1
          maximum: 2147483647
      minProperties: 1
      description: Модуль остаётся в своей программе. name и position не могут быть null. Изменение номера на занятый возвращает 409.
    ProgramPage:
      type: object
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Program'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    Student:
      type: object
      required:
        - id
        - name
        - birth_date
        - status
        - curator_id
        - curator_name
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
        birth_date:
          type: string
          format: date
          nullable: true
          description: Необязательно; существующая дата YYYY-MM-DD, не позднее текущей даты по Москве. null очищает значение.
        status:
          type: string
          enum:
            - active
            - archived
        curator_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        curator_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Parent:
      type: object
      required:
        - id
        - name
        - phone
        - email
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
        email:
          type: string
        status:
          type: string
          enum:
            - active
            - archived
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StudentCreate:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        birth_date:
          type: string
          format: date
          nullable: true
          description: Необязательно; существующая дата YYYY-MM-DD, не позднее текущей даты по Москве. null очищает значение.
        status:
          type: string
          enum:
            - active
            - archived
          default: active
        curator_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
    StudentUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        birth_date:
          type: string
          format: date
          nullable: true
          description: Необязательно; существующая дата YYYY-MM-DD, не позднее текущей даты по Москве. null очищает значение.
        status:
          type: string
          enum:
            - active
            - archived
        curator_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
      minProperties: 1
    ParentCreate:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          $ref: '#/components/schemas/TeacherPhone'
        email:
          type: string
          nullable: true
          maxLength: 254
        status:
          type: string
          enum:
            - active
            - archived
          default: active
      anyOf:
        - required:
            - phone
          properties:
            phone:
              type: string
              minLength: 1
        - required:
            - email
          properties:
            email:
              type: string
              minLength: 1
    ParentUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          $ref: '#/components/schemas/TeacherPhone'
        email:
          type: string
          nullable: true
          maxLength: 254
        status:
          type: string
          enum:
            - active
            - archived
      minProperties: 1
      description: После объединения PATCH с текущей карточкой должен остаться хотя бы один контакт. null очищает контакт; ФИО и статус не могут быть null.
    FamilyLink:
      type: object
      required:
        - student_id
        - parent_id
        - relationship
        - is_primary
      properties:
        student_id:
          type: integer
          format: int64
          minimum: 1
        parent_id:
          type: integer
          format: int64
          minimum: 1
        relationship:
          type: string
          minLength: 1
          maxLength: 100
        is_primary:
          type: boolean
    FamilyLinkCreate:
      type: object
      additionalProperties: false
      required:
        - parent_id
        - relationship
      properties:
        parent_id:
          type: integer
          format: int64
          minimum: 1
        relationship:
          type: string
          minLength: 1
          maxLength: 100
        is_primary:
          type: boolean
          default: false
    FamilyLinkUpdate:
      type: object
      additionalProperties: false
      properties:
        relationship:
          type: string
          minLength: 1
          maxLength: 100
        is_primary:
          type: boolean
      minProperties: 1
    ParentLink:
      allOf:
        - $ref: '#/components/schemas/Parent'
        - $ref: '#/components/schemas/FamilyLink'
    StudentLink:
      allOf:
        - $ref: '#/components/schemas/Student'
        - $ref: '#/components/schemas/FamilyLink'
    StudentCard:
      allOf:
        - $ref: '#/components/schemas/Student'
        - type: object
          required:
            - parents
          properties:
            parents:
              type: array
              items:
                $ref: '#/components/schemas/ParentLink'
    ParentCard:
      allOf:
        - $ref: '#/components/schemas/Parent'
        - type: object
          required:
            - children
          properties:
            children:
              type: array
              items:
                $ref: '#/components/schemas/StudentLink'
    StudentPage:
      type: object
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Student'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    ParentPage:
      type: object
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Parent'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    TeacherPhone:
      type: string
      nullable: true
      maxLength: 100
      description: Необязательный телефон. Пробелы, скобки и дефисы удаляются; сохраняется международный формат + и 7–15 цифр. Российские номера из 11 цифр с началом 7 или 8 нормализуются в +7. Пустое значение очищает телефон.
    Teacher:
      type: object
      required: [id, name, phone, email, specialization, status, user_id, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 200 }
        phone: { type: string }
        email: { type: string }
        specialization: { type: string, maxLength: 500 }
        status: { type: string, enum: [active, archived] }
        user_id: { type: integer, format: int64, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Password:
      type: string
      minLength: 12
      maxLength: 72
      description: Не менее 12 Unicode-символов и не более 72 байт UTF-8 (лимит bcrypt). Входящий пароль никогда не журналируется.
    Roles:
      type: array
      minItems: 1
      uniqueItems: true
      items: { type: string, enum: [admin, leader, teacher, curator] }
    User:
      type: object
      required: [id, email, name, roles, blocked, must_change_password, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        roles: { $ref: '#/components/schemas/Roles' }
        blocked: { type: boolean }
        must_change_password: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message, field_errors, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        field_errors: { type: object, additionalProperties: { type: string } }
        request_id: { type: string }
  responses:
    Error:
      description: Ошибка запроса
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
