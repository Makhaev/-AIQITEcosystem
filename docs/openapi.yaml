                  program_name: { type: string }
                  teacher_id: { type: integer, format: int64, nullable: true }
                  teacher_name: { type: string, nullable: true }
                  starts_on: { type: string, format: date }
                  ends_on: { type: string, format: date, nullable: true }
            upcoming_lessons:
              type: array
              maxItems: 10
              items: { $ref: '#/components/schemas/StudentLesson' }
            attendance:
              type: object
              required: [from, to, present, late, absent, excused, unmarked, percent, items]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
                present: { type: integer, minimum: 0 }
                late: { type: integer, minimum: 0 }
                absent: { type: integer, minimum: 0 }
                excused: { type: integer, minimum: 0 }
                unmarked: { type: integer, minimum: 0 }
                percent: { type: number, minimum: 0, maximum: 100, nullable: true }
                items:
                  type: array
                  items:
                    allOf:
                      - { $ref: '#/components/schemas/StudentLesson' }
                      - type: object
                        required: [status, comment]
                        properties:
                          status: { type: string, enum: [unmarked, present, late, absent, excused] }
                          comment: { type: string, maxLength: 500 }
        - oneOf:
            - allOf:
                - { $ref: '#/components/schemas/Student' }
                - type: object
                  required: [age]
                  properties:
                    full_access: { type: boolean, enum: [true] }
                    age: { type: integer, minimum: 0, nullable: true, description: 'Полные годы на текущую дату Europe/Moscow, вычисляются при чтении независимо от периода посещаемости. Без даты рождения — null. Для 29 февраля в невисокосном году возраст увеличивается 1 марта.' }
                    parents: { type: array, items: { $ref: '#/components/schemas/ParentLink' } }
                    history:
                      type: array
                      items:
                        type: object
                        required: [id, occurred_at, actor_name, action, object_type, object_id]
                        properties:
                          id: { type: integer, format: int64 }
                          occurred_at: { type: string, format: date-time }
                          actor_name: { type: string, nullable: true }
                          action: { type: string }
                          object_type: { type: string }
                          object_id: { type: integer, format: int64, nullable: true }
            - type: object
              properties:
                full_access: { type: boolean, enum: [false] }
              not:
                anyOf:
                  - { required: [birth_date] }
                  - { required: [curator_id] }
                  - { required: [curator_name] }
                  - { required: [created_at] }
                  - { required: [updated_at] }
                  - { required: [parents] }
                  - { required: [history] }
                  - { required: [age] }
