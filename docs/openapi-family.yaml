        author_id:
          type: integer
          format: int64
        author_name:
          type: string
        subject:
          type: string
        body:
          type: string
          description: Immutable opening message
        reply:
          type: string
          description: Latest answer for compatibility; complete history is in messages
        assignee_id:
          type: integer
          format: int64
          nullable: true
        assignee_name:
          type: string
        status:
          type: string
          enum:
            - new
            - assigned
            - in_progress
            - answered
            - closed
        revision:
          type: integer
        created_at:
          type: string
          format: date-time
        answered_at:
          type: string
          format: date-time
          nullable: true
          description: Last recorded answer; unknown for migrated replies
        closed_at:
          type: string
          format: date-time
          nullable: true
          description: Current closure; prior dates remain in events
        actions:
          type: array
          items:
            type: string
        messages:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
