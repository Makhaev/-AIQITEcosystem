components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: aiq_session
    csrfCookie:
      type: apiKey
      in: cookie
      name: aiq_csrf
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    from:
      in: query
      name: from
      description: First included Moscow date; from and to must be supplied together
      schema:
        type: string
        format: date
    to:
      in: query
      name: to
      description: Last included Moscow date, on or after from
      schema:
        type: string
        format: date
    id:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    search:
      in: query
      name: search
      description: Up to 400 UTF-8 bytes; public title/name only
      schema:
        type: string
  schemas:
    FamilyRequestUpload:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        data:
          type: string
          format: byte
          description: Base64 file bytes; content type validated using the private-file allowlist
      additionalProperties: false
    FamilyRequestInput:
      type: object
      required:
        - subject
        - body
      properties:
        student_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        subject:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 5000
        files:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/FamilyRequestUpload'
      additionalProperties: false
    FamilyRequestChange:
      type: object
      required:
        - action
        - revision
      properties:
        action:
          type: string
          enum:
            - assign
            - start
            - message
            - answer
            - close
            - reopen
        revision:
          type: integer
          minimum: 1
        assignee_id:
          type: integer
          format: int64
          minimum: 1
          description: Required for assign
        body:
          type: string
          maxLength: 5000
          description: Required for message and answer; prohibited on other actions
        reason:
          type: string
          maxLength: 5000
          description: Required for reopen
        files:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/FamilyRequestUpload'
          description: Only message and answer may attach files; 10 MiB combined decoded limit
      additionalProperties: false
    FamilyRequest:
      type: object
      properties:
