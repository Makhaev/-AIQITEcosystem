                format: int64
                nullable: true
              author_name:
                type: string
              body:
                type: string
              kind:
                type: string
                enum:
                  - message
                  - answer
              created_at:
                type: string
                format: date-time
                nullable: true
              files:
                type: array
                items:
                  $ref: '#/components/schemas/File'
        events:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
              from_status:
                type: string
              to_status:
                type: string
              actor_id:
                type: integer
                format: int64
                nullable: true
              actor_name:
                type: string
              assignee_id:
                type: integer
                format: int64
                nullable: true
              reason:
                type: string
              created_at:
