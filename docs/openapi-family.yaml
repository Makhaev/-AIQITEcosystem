  /family-reports/{id}/actions:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      summary: Submit, return, approve, publish, withdraw or create a correction
      description: >-
        draft -> review -> approved -> published. Return requires a reason and changes review to draft. Only admin or
        the assigned education leader may approve/publish/withdraw; no content editor may approve their version. Admin
        or current curator submits and creates corrections. Correction creates the next draft without replacing the
        family publication. Withdraw targets published_version and requires a reason; it never restores an older
        publication. Concurrent repeats of the current published version are successful without duplicate audit or
        recipient notifications, even with the original revision. All other mutations require current revision and
        target version. State, edition, publication, audit and in-app notifications commit atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportAction'
      responses:
        '200':
          description: Authorized report view after action; returning or withdrawing can remove further read access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          description: Invalid action payload or reviewer/next focus missing
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '403':
          description: Role or state does not allow this action; self-approval forbidden
          content:
