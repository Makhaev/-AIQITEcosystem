        ends_at:
          type: string
          format: date-time
          description: Lessons only
        due_on:
          type: string
          format: date
          description: Assignments only; whole Moscow day
    ParentHome:
      type: object
      required:
        - programs
        - blocks
        - totals
        - parent
      properties:
        next_lesson:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              format: int64
            topic:
              type: string
            starts_at:
              type: string
              format: date-time
            ends_at:
              type: string
              format: date-time
            status:
              type: string
        programs:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              version:
                type: integer
              state:
                type: string
                enum:
                  - ready
                  - no_plan
              percent:
                type: number
                nullable: true
                description: Existing group plan completion; not personal skill
        totals:
          type: object
          additionalProperties:
            type: integer
        blocks:
          type: object
          description: Parent-safe assignments, goals, attempts and published observations; projects remain empty
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Record'
        parent:
          type: object
          required:
            - attendance
            - lessons
            - reports
            - requests
            - events
            - totals
          properties:
            attendance:
              type: object
              required:
                - from
                - to
                - present
                - late
                - absent
                - excused
                - total
                - percent
              properties:
                from:
                  type: string
                  format: date
                to:
                  type: string
                  format: date
                present:
                  type: integer
                  minimum: 0
                late:
                  type: integer
                  minimum: 0
                absent:
                  type: integer
                  minimum: 0
                excused:
                  type: integer
                  minimum: 0
                total:
                  type: integer
                  minimum: 0
                percent:
                  type: number
                  nullable: true
                  description: >-
                    (present + late) / total * 100; null when total is zero. Included participants in completed lessons
                    only.
            lessons:
              type: array
              maxItems: 5
              items:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  topic:
                    type: string
                  starts_at:
                    type: string
                    format: date-time
                  ends_at:
                    type: string
                    format: date-time
                  status:
                    type: string
                    enum:
                      - scheduled
                  attendance:
                    type: string
            reports:
              type: array
              maxItems: 5
              items:
                $ref: '#/components/schemas/Report'
            requests:
              type: array
              maxItems: 5
              items:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  student_id:
                    type: integer
                    format: int64
                  subject:
                    type: string
                  body:
                    type: string
                  reply:
                    type: string
                  revision:
                    type: integer
            events:
              type: array
              maxItems: 5
              items:
                $ref: '#/components/schemas/StudyEvent'
            totals:
              type: object
              properties:
                lessons:
                  type: integer
                  minimum: 0
                reports:
                  type: integer
                  minimum: 0
                requests:
                  type: integer
                  minimum: 0
                events:
                  type: integer
                  minimum: 0
