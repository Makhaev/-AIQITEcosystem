          default: false
        parents:
          type: boolean
          default: false
        revision:
          type: integer
          description: Required current revision for observations
      additionalProperties: false
    ReportInput:
      type: object
      description: >-
        With generate=true both dates are required and title/body are generated without AI. Otherwise title/body are
        required. Omitted dates preserve an existing snapshot; legacy text reports remain supported. Changing dates
        refreshes the snapshot; generate=true also replaces the text. Only drafts can be saved. A previous published
        edition remains visible until replacement or withdrawal.
      properties:
        from:
          type: string
          format: date
          description: Inclusive Moscow start date
        to:
          type: string
          format: date
          description: Inclusive Moscow end date, not before from
        generate:
          type: boolean
          default: false
        next_focus:
          type: string
          maxLength: 5000
        reviewer_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: >-
            Active admin or education_leader; required on submission and must not be a content editor of this version.
            Assignment is not approval.
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 20000
        revision:
          type: integer
          description: Required current revision when editing
        file_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: integer
            minimum: 1
      additionalProperties: false
    ReportAction:
      type: object
      required:
        - action
        - version
        - revision
      properties:
        action:
          type: string
          enum:
            - submit
            - return
            - approve
            - publish
            - withdraw
            - correct
        version:
          type: integer
          minimum: 1
          description: Current working version except withdraw which targets published_version
        revision:
          type: integer
          minimum: 1
          description: Current staff revision; publish retry of the current publication is idempotent
        reason:
          type: string
          maxLength: 5000
          description: Required for return and withdraw; staff-only decision text
      additionalProperties: false
    Report:
      type: object
      description: >-
        Staff receives authorized version and capabilities; family receives only the immutable selected publication
        without decision remarks or actions. Published can remain true on a working draft when an older edition is live.
      properties:
        version:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
            - draft
            - review
            - approved
            - published
            - withdrawn
        published_version:
          type: integer
          minimum: 1
          nullable: true
        approved_by:
          type: integer
          format: int64
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        legacy:
          type: boolean
          description: Migrated publication without invented approval metadata
        actions:
          type: array
          items:
            type: string
            enum:
              - edit
              - submit
              - return
              - approve
              - publish
              - withdraw
              - correct
          description: Staff-only current capabilities
        decisions:
          type: array
          description: Staff-only transition history and remarks
          items:
            type: object
            properties:
              version:
                type: integer
              action:
                type: string
              reason:
                type: string
              actor_id:
                type: integer
                format: int64
              actor_name:
                type: string
              created_at:
                type: string
                format: date-time
        snapshot:
          $ref: '#/components/schemas/ReportSnapshot'
        next_focus:
          type: string
        reviewer_id:
          type: integer
          format: int64
          nullable: true
        reviewer_name:
          type: string
        author_id:
          type: integer
          format: int64
        author_name:
          type: string
        updated_by:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
          nullable: true
        withdrawn_at:
          type: string
          format: date-time
          nullable: true
        id:
          type: integer
          format: int64
        student_id:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
        revision:
          type: integer
        published:
          type: boolean
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
    ReportSnapshot:
      type: object
