openapi: 3.0.3
info:
  title: AIQ Family Access
  version: '1.5'
  description: >-
    Family endpoints recheck session, current account bindings, active pupil, confirmed parent relationship and current
    publications on every request. Staff endpoints require admin or the pupil's current curator as documented. Writes
    require the existing session CSRF header. All responses are private, no-store.
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /family/students:
    get:
      summary: Search only own or confirmed linked active pupils; own marks the student's own binding
      parameters:
        - $ref: '#/components/parameters/search'
        - $ref: ./openapi-common.yaml#/parameters/Page
        - $ref: ./openapi-common.yaml#/parameters/PageSize
      responses:
        '200':
          description: Authorized page; stable ordering ending in ID
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - page
                  - page_size
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Student'
                  total:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  page_size:
                    type: integer
                    minimum: 1
                    maximum: 100
        '401':
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '403':
          description: Role denied
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '404':
          description: Object not found or access revoked
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - session: []
  /family/students/{id}/lessons:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Own lessons and attendance status, without roster or comments
      parameters:
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: ./openapi-common.yaml#/parameters/Page
        - $ref: ./openapi-common.yaml#/parameters/PageSize
      responses:
        '200':
          description: Authorized page; stable ordering ending in ID
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - page
                  - page_size
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lesson'
                  total:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  page_size:
                    type: integer
                    minimum: 1
                    maximum: 100
        '401':
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '403':
          description: Role denied
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '404':
          description: Object not found or access revoked
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - session: []
  /family/students/{id}/learning:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Safe current records with independently filtered sources and files
      parameters:
        - $ref: '#/components/parameters/search'
        - in: query
          name: kind
          schema:
            type: string
            enum:
              - goals
              - assignments
              - attempts
              - observations
              - projects
        - in: query
          name: assignment_id
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Filter attempts by their assignment, within the authorized pupil scope
        - $ref: ./openapi-common.yaml#/parameters/Page
        - $ref: ./openapi-common.yaml#/parameters/PageSize
      responses:
        '200':
          description: Authorized page; stable ordering ending in ID
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - page
                  - page_size
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Record'
                  total:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  page_size:
                    type: integer
                    minimum: 1
                    maximum: 100
        '401':
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '403':
          description: Role denied
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '404':
          description: Object not found or access revoked
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - session: []
  /family/students/{id}/progress:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Personal counts of goals and assignments
      responses:
        '200':
          description: Counts, not a skill score or group percentage
          content:
            application/json:
              schema:
                type: object
                properties:
                  goals:
                    type: integer
                  achieved_goals:
                    type: integer
                  assignments:
                    type: integer
                  completed_assignments:
                    type: integer
        '404':
          description: Pupil unavailable
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - session: []
  /family/students/{id}/home:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Own student's home, never a parent or staff substitute
      responses:
        '200':
          description: Nearest scheduled lesson, safe program summaries and up to five records per block
          content:
            application/json:
              schema:
                type: object
                properties:
                  next_lesson:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: integer
                        format: int64
                      topic:
                        type: string
                      starts_at:
                        type: string
                        format: date-time
                      ends_at:
                        type: string
                        format: date-time
                      status:
                        type: string
                  programs:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        version:
                          type: integer
                        state:
                          type: string
                          enum:
                            - ready
                            - no_plan
                        percent:
                          type: number
                          nullable: true
                          description: Existing group plan completion; not personal skill
                  blocks:
                    type: object
                    description: assignments, goals, attempts, projects, observations; current own safe records
                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/Record'
                  totals:
                    type: object
                    additionalProperties:
                      type: integer
        '401':
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '403':
          description: Role denied
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '404':
          description: Own active student binding required
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - session: []
  /family/students/{id}/parent-home:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Parent dashboard for one currently confirmed child
      description: >-
        Requires a confirmed parent relationship. Staff roles do not extend scope. Up to five items per block. Reports
        must be published; observations require parent publication for the current revision; requests belong to the
        current actor. From/to affect attendance only and default to the current Moscow month. No financial information.
        All responses are private, no-store.
      parameters:
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
      responses:
        '200':
          description: Authorized child dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentHome'
        '400':
          description: Invalid or incomplete date range
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '401':
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '403':
          description: Family role denied
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '404':
          description: Confirmed active child unavailable
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - session: []
  /family/students/{id}/events:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Upcoming lessons and active assignment deadlines for an authorized child
      description: >-
        Scheduled lessons whose end is in the future, including ongoing lessons; active assignment deadlines today or
        later in Moscow. Sorted by start/deadline, kind and ID. Deadlines are all-day dates, not UTC instants. No staff
        events or other children's data. Page size 20; counters and search use authorized data only.
      parameters:
        - $ref: '#/components/parameters/search'
        - $ref: ./openapi-common.yaml#/parameters/Page
        - $ref: ./openapi-common.yaml#/parameters/PageSize
      responses:
        '200':
          description: Authorized page; stable ordering ending in ID
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - page
                  - page_size
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/StudyEvent'
                  total:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  page_size:
                    type: integer
                    minimum: 1
                    maximum: 100
        '400':
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '401':
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '403':
          description: Family role denied
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '404':
          description: Child unavailable
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - session: []
  /family/assignments/{id}/attempts:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      summary: Submit a new immutable attempt for the student's own assignment
      description: >-
        Requires X-CSRF-Token. Identity, reviewer and scope come from the session and assignment. Uses existing
        assignment state, format and Moscow deadline rules. No draft state. One optional upload commits atomically with
        the attempt and is granted to its reviewer. Request limit 15 MiB; decoded file at most 10 MiB. No client file
        IDs accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - revision
                - answer
              properties:
                revision:
                  type: integer
                  minimum: 1
                answer:
                  type: string
                  maxLength: 10000
                  description: Text or HTTP(S) URL; empty for file format
                file:
                  type: object
                  additionalProperties: false
                  required:
                    - name
                    - data
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 200
                    data:
                      type: string
                      format: byte
                      description: Base64 of an allowed file, 1 byte to 10 MiB decoded
      responses:
        '201':
          description: New attempt in submitted state; earlier attempts unchanged
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
        '400':
          description: Invalid input, wrong format or closed assignment
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '401':
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '403':
          description: Student role required or CSRF denied
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '404':
          description: Own assignment unavailable
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '409':
          description: Stale revision, late submission prohibited or reviewer unavailable
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '415':
          description: File content type not supported
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - session: []
          csrfCookie: []
          csrfHeader: []
  /family/students/{id}/reports:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Published family reports only
      parameters:
        - $ref: '#/components/parameters/search'
        - $ref: ./openapi-common.yaml#/parameters/Page
        - $ref: ./openapi-common.yaml#/parameters/PageSize
      responses:
        '200':
          description: Authorized page; stable ordering ending in ID
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - page
                  - page_size
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Report'
                  total:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  page_size:
                    type: integer
                    minimum: 1
                    maximum: 100
        '401':
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '403':
          description: Role denied
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '404':
          description: Object not found or access revoked
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - session: []
  /family/students/{id}/requests:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Only this account's requests and replies for the permitted child
      parameters:
        - $ref: '#/components/parameters/search'
        - $ref: ./openapi-common.yaml#/parameters/Page
        - $ref: ./openapi-common.yaml#/parameters/PageSize
      responses:
        '200':
          description: Authorized page; stable ordering ending in ID
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - page
                  - page_size
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FamilyRequest'
                  total:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  page_size:
                    type: integer
                    minimum: 1
                    maximum: 100
        '401':
          description: Invalid session
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '403':
          description: Role denied
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '404':
          description: Object not found or access revoked
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - session: []
    post:
      summary: Create an author-private request about the permitted child
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyRequestInput'
      responses:
        '201':
          description: Authorized result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyRequest'
        '404':
          description: Pupil unavailable
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - session: []
          csrfCookie: []
          csrfHeader: []
  /family/requests:
    get:
      summary: List only this author's currently accessible requests, including requests without a child
      parameters:
        - $ref: '#/components/parameters/search'
        - in: query
          name: status
          schema:
            type: string
            enum:
              - new
              - assigned
              - in_progress
              - answered
              - closed
        - $ref: ./openapi-common.yaml#/parameters/Page
        - $ref: ./openapi-common.yaml#/parameters/PageSize
      responses:
        '200':
          description: Authorized page; stable ordering ending in ID
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - page
                  - page_size
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FamilyRequest'
                  total:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  page_size:
                    type: integer
                    minimum: 1
                    maximum: 100
        '403':
          description: Required role unavailable
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - session: []
    post:
      summary: Create a request with an optional permitted child
      description: >-
        Without a child the actor must have an active linked parent card. Requests linked to a child require current
        family access. Existing student requests remain supported for their own child card. At most 3 attachments and 10
        MiB decoded total per message; JSON request limit is 15 MiB. Uploads are stored atomically with the opening
        message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyRequestInput'
      responses:
        '201':
          description: Authorized result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyRequest'
        '400':
          description: Invalid text or attachments
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '404':
          description: Parent or child unavailable
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '415':
          description: Unsupported attachment content
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - session: []
          csrfCookie: []
          csrfHeader: []
  /family/requests/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Read one's own request with messages, attachments and transition history
      description: >-
        Another parent of the same child has no access. Mixed staff roles never expand this family projection. Child
        access is rechecked on every request; unlinked requests require an active parent card. Responses are private and
        no-store.
      responses:
        '200':
          description: Authorized result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyRequest'
        '404':
          description: Request unavailable
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - session: []
  /family/requests/{id}/actions:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      summary: Author adds a message, closes an answered request or reopens a closed one with a reason
      description: >-
        Closed requests accept only reopen. Author message on an answered request moves it back to in_progress.
        Reopening restores assigned if the assignee is still eligible; otherwise clears the assignee and returns new.
        History and last answer date remain; current closure date clears. No SLA timers or escalations are configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyRequestChange'
      responses:
        '200':
          description: Authorized result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyRequest'
        '400':
          description: Invalid input, reason or assignee
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '403':
          description: Action not permitted by role, assignment or state
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '404':
          description: Request unavailable
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '409':
          description: Stale revision; no changes committed
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '415':
          description: Unsupported attachment content
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - session: []
          csrfCookie: []
          csrfHeader: []
  /family/requests/{id}/files/{file_id}:
    parameters:
      - $ref: '#/components/parameters/id'
      - in: path
        name: file_id
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      summary: Download an attachment of one's own authorized correspondence
      description: >-
        Thread access and exact file membership are checked afresh. No public links or family-wide file grants. Response
        has private/no-store, attachment disposition, nosniff and sandbox headers.
      responses:
        '200':
          description: Private attachment bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Request or attachment unavailable
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - session: []
  /family-requests:
    get:
      summary: Admin sees all requests; curator sees only requests about currently assigned pupils
      parameters:
        - $ref: '#/components/parameters/search'
        - in: query
          name: status
          schema:
            type: string
            enum:
              - new
              - assigned
              - in_progress
              - answered
              - closed
        - $ref: ./openapi-common.yaml#/parameters/Page
        - $ref: ./openapi-common.yaml#/parameters/PageSize
      responses:
        '200':
          description: Authorized page; stable ordering ending in ID
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - page
                  - page_size
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FamilyRequest'
                  total:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  page_size:
                    type: integer
                    minimum: 1
                    maximum: 100
        '403':
          description: Required role unavailable
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - session: []
  /family-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Staff request card; general requests are admin-only
      responses:
        '200':
          description: Authorized result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyRequest'
        '404':
          description: Request unavailable
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - session: []
  /family-requests/{id}/actions:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      summary: Assign, start, message, answer, close or reopen according to server capabilities
      description: >-
        Admin or current curator assigns an active admin or the child's current curator; general requests can only be
        assigned to admins. Admin or the currently responsible authorized employee starts assigned work, answers
        in_progress, closes answered, and reopens closed with a reason. Reassignment preserves history and existing
        state except new becomes assigned. Assignment never expands pupil access. Replies are appended and never
