openapi: 3.0.3
info: { title: AIQ — повторная приёмка F01–F05, version: 0.1.0 }
paths:
  /branches:
    get:
      summary: Филиалы доступных групп; руководитель видит всю организацию
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        '200':
          description: Страница филиалов
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, page_size]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Branch' } }
                  total: { type: integer, minimum: 0 }
                  page: { type: integer, minimum: 1 }
                  page_size: { type: integer, minimum: 1, maximum: 100 }
        '401': { $ref: './openapi.yaml#/components/responses/Error' }
        '403': { $ref: './openapi.yaml#/components/responses/Error' }
    post:
      summary: Создать филиал — только администратор
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BranchInput' } } } }
      responses:
        '201': { description: Филиал создан, content: { application/json: { schema: { $ref: '#/components/schemas/Branch' } } } }
        '400': { $ref: './openapi.yaml#/components/responses/Error' }
        '403': { $ref: './openapi.yaml#/components/responses/Error' }
  /branches/{id}:
    parameters:
      - { $ref: '#/components/parameters/ID' }
    put:
      summary: Переименовать или архивировать филиал — только администратор
      description: Архивирование сохраняет существующие группы и историю.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BranchInput' } } } }
      responses:
        '200': { description: Филиал сохранён, content: { application/json: { schema: { $ref: '#/components/schemas/Branch' } } } }
        '400': { $ref: './openapi.yaml#/components/responses/Error' }
        '403': { $ref: './openapi.yaml#/components/responses/Error' }
        '404': { $ref: './openapi.yaml#/components/responses/Error' }
  /students/{id}/notes:
    parameters:
      - { $ref: '#/components/parameters/ID' }
    get:
      summary: Внутренние заметки доступного ученика с историей исправлений
      description: Полный служебный доступ; педагогу и семье лента не выдаётся. После смены назначения прежний куратор теряет доступ, новый получает историю.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 } }
      responses:
        '200':
          description: Страница заметок, от новых к старым
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, page_size]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Note' } }
                  total: { type: integer, minimum: 0 }
                  page: { type: integer, minimum: 1 }
                  page_size: { type: integer, enum: [20] }
        '403': { $ref: './openapi.yaml#/components/responses/Error' }
        '404': { $ref: './openapi.yaml#/components/responses/Error' }
    post:
      summary: Добавить внутреннюю заметку
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NoteInput' } } } }
      responses:
        '201': { $ref: '#/components/responses/SavedNote' }
        '400': { $ref: './openapi.yaml#/components/responses/Error' }
        '403': { $ref: './openapi.yaml#/components/responses/Error' }
        '404': { $ref: './openapi.yaml#/components/responses/Error' }
  /students/{id}/notes/{note_id}:
    parameters:
      - { $ref: '#/components/parameters/ID' }
      - { name: note_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    patch:
      summary: Исправить заметку — автор с текущим доступом или администратор
      description: Исправление добавляет версию истории; прежний текст сохраняется.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/NoteInput' }
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer, minimum: 1, description: Текущая версия до исправления }
      responses:
        '200': { $ref: '#/components/responses/SavedNote' }
        '400': { $ref: './openapi.yaml#/components/responses/Error' }
        '403': { $ref: './openapi.yaml#/components/responses/Error' }
        '404': { $ref: './openapi.yaml#/components/responses/Error' }
        '409': { $ref: './openapi.yaml#/components/responses/Error' }
  /dashboard/operations:
    get:
      summary: Наполняемость, низкая явка и задачи — руководитель или администратор
      description: |
        Даты включительны, по Москве. Период по умолчанию — текущий месяц.
        Наполняемость = действующие ученики по текущим зачислениям / вместимость активных групп.
        Явка = (present + late) / (present + late + absent + excused) по включённым участникам завершённых занятий периода.
        Без отметок явка равна null; низкая явка строго ниже threshold.
        Задачи in_progress считаются по текущему статусу; done — по closed_at в периоде.
        Филиал задачи определяется по связанной группе, занятию или текущему зачислению ученика.
        Задачи без связи учитываются только в сводке всей организации.
      parameters:
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: branch_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: threshold, in: query, schema: { type: number, minimum: 0, maximum: 100, default: 70 } }
      responses:
        '200':
          description: Сводка текущего состояния и показателей периода
          content:
            application/json:
              schema:
                type: object
                required: [groups, students, capacity, occupancy_percent, tasks_in_progress, tasks_closed, low_attendance_groups, date_from, date_to, branch_id, low_attendance_threshold]
                properties:
                  groups: { type: array, items: { $ref: '#/components/schemas/GroupMetrics' } }
                  students: { type: integer, minimum: 0 }
                  capacity: { type: integer, minimum: 0 }
                  occupancy_percent: { type: number, nullable: true }
                  tasks_in_progress: { type: integer, minimum: 0 }
                  tasks_closed: { type: integer, minimum: 0 }
                  low_attendance_groups: { type: integer, minimum: 0 }
                  date_from: { type: string, format: date }
                  date_to: { type: string, format: date }
                  branch_id: { type: integer, format: int64, minimum: 0 }
                  low_attendance_threshold: { type: number, minimum: 0, maximum: 100 }
        '400': { $ref: './openapi.yaml#/components/responses/Error' }
        '403': { $ref: './openapi.yaml#/components/responses/Error' }
        '404': { $ref: './openapi.yaml#/components/responses/Error' }
components:
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
  schemas:
    BranchInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [active, archived], default: active }
    Branch:
      allOf:
        - { $ref: '#/components/schemas/BranchInput' }
        - type: object
          required: [id, status]
          properties:
            id: { type: integer, format: int64 }
    NoteInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
    Note:
      type: object
      required: [id, author_id, author_name, body, version, created_at, updated_at, can_edit, history]
      properties:
        id: { type: integer, format: int64 }
        author_id: { type: integer, format: int64 }
        author_name: { type: string }
        body: { type: string }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        can_edit: { type: boolean }
        history:
          type: array
          items:
            type: object
            required: [version, body, editor_name, created_at]
            properties:
              version: { type: integer, minimum: 1 }
              body: { type: string }
              editor_name: { type: string }
              created_at: { type: string, format: date-time }
    GroupMetrics:
      type: object
      required: [id, name, branch_id, branch_name, capacity, students, occupancy_percent, attendance_percent, low_attendance]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        branch_id: { type: integer, format: int64, nullable: true }
        branch_name: { type: string, nullable: true }
        capacity: { type: integer, minimum: 1 }
        students: { type: integer, minimum: 0 }
        occupancy_percent: { type: number }
        attendance_percent: { type: number, nullable: true }
        low_attendance: { type: boolean }
  responses:
    SavedNote:
      description: Заметка сохранена
      content:
        application/json:
          schema:
            type: object
            required: [id, version]
            properties:
              id: { type: integer, format: int64 }
              version: { type: integer, minimum: 1 }
