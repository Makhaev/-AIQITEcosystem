openapi: 3.0.3
info:
  title: AIQ Core M4-02 Password Reset
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - csrfCookie: []
    csrfHeader: []
paths:
  /auth/password-reset/request:
    post:
      summary: Request a password reset without disclosing account existence
      description: >-
        Requires matching Origin and CSRF. Always returns the same 202 body for known, unknown and blocked emails,
        including email throttling and SMTP failures. IP limit is 20 per 30 minutes; email limit is 5 per 30 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '202':
          description: Request accepted; delivery is not guaranteed
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: >-
                      Если аккаунт доступен, мы отправим письмо со ссылкой для восстановления пароля. Ссылка действует
                      30 минут.
        '400':
          description: Invalid JSON
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '403':
          description: Invalid Origin or CSRF
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '429':
          description: IP request limit exceeded
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '503':
          description: Background delivery capacity exhausted
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - csrfCookie: []
          csrfHeader: []
  /auth/password-reset/confirm:
    post:
      summary: Set a new password and revoke every user session atomically
      description: >-
        Token expires after 30 minutes and can be used once. Limits are 30 attempts per IP and 5 per token per 30
        minutes. The new password must differ from the current password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
                - password
              properties:
                token:
                  type: string
                  minLength: 43
                  maxLength: 43
                  writeOnly: true
                password:
                  type: string
                  minLength: 12
                  maxLength: 72
                  writeOnly: true
                  description: Minimum 12 Unicode characters; maximum 72 UTF-8 bytes
      responses:
        '204':
          description: Password changed; all sessions and reset links revoked; browser cookies cleared
        '400':
          description: reset_invalid or validation_error; account unchanged
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '403':
          description: Invalid Origin or CSRF
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        '429':
          description: Attempt limit exceeded; account unchanged
          content:
            application/json:
              schema:
                $ref: ./openapi-common.yaml#/schemas/Error
        default:
          $ref: ./openapi-common.yaml#/responses/Error
      security:
        - csrfCookie: []
          csrfHeader: []
components:
  securitySchemes:
    csrfCookie:
      type: apiKey
      in: cookie
      name: aiq_csrf
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
