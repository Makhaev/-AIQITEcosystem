versions:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  get:
    tags:
      - M2 Program versions
    summary: Версии программы
    description: >-
      admin/leader/methodologist/education_leader читают все версии; teacher/curator — только published/archived,
      связанные с доступными группами или занятиями. Доступ через занятие учитывает даты зачисления и сохранённый
      состав; позднее зачисление в переведённую группу не открывает её прежние версии. Порядок — номер по убыванию.
    security:
      - session: []
    responses:
      '200':
        description: Успешно
        content:
          application/json:
            schema:
              $ref: '#/schemas/VersionPage'
      '400':
        $ref: ./openapi.yaml#/components/responses/Error
      '401':
        $ref: ./openapi.yaml#/components/responses/Error
      '403':
        $ref: ./openapi.yaml#/components/responses/Error
      '404':
        $ref: ./openapi.yaml#/components/responses/Error
      '409':
        $ref: ./openapi.yaml#/components/responses/Error
      '500':
        $ref: ./openapi.yaml#/components/responses/Error
  post:
    tags:
      - M2 Program versions
    summary: Создать черновик
    description: >-
      Только methodologist. source_version_id копирует published/archived этой же программы. Публикация не переносит
      группы автоматически.
    security:
      - session: []
        csrfCookie: []
        csrfHeader: []
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/schemas/CreateVersion'
    responses:
      '201':
        description: Успешно
        content:
          application/json:
            schema:
              $ref: '#/schemas/Version'
      '400':
        $ref: ./openapi.yaml#/components/responses/Error
      '401':
        $ref: ./openapi.yaml#/components/responses/Error
      '403':
        $ref: ./openapi.yaml#/components/responses/Error
      '404':
        $ref: ./openapi.yaml#/components/responses/Error
      '409':
        $ref: ./openapi.yaml#/components/responses/Error
      '500':
        $ref: ./openapi.yaml#/components/responses/Error
version:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    - name: version_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  get:
    tags:
      - M2 Program versions
    summary: Версия со структурой и историей
    description: >-
      Проверяются программа и объектный доступ. Педагогам и кураторам внутренние комментарии проверки не выдаются:
      events=[].
    security:
      - session: []
    responses:
      '200':
        description: Успешно
        content:
          application/json:
            schema:
              $ref: '#/schemas/VersionCard'
      '400':
        $ref: ./openapi.yaml#/components/responses/Error
      '401':
        $ref: ./openapi.yaml#/components/responses/Error
      '403':
        $ref: ./openapi.yaml#/components/responses/Error
      '404':
        $ref: ./openapi.yaml#/components/responses/Error
      '409':
        $ref: ./openapi.yaml#/components/responses/Error
      '500':
        $ref: ./openapi.yaml#/components/responses/Error
  put:
    tags:
      - M2 Program versions
    summary: Сохранить структуру черновика
    description: >-
      Только methodologist. Атомарная замена документа по revision. Опубликованные и архивные документы неизменяемы.
      Максимум 1 МиБ (1048576 байт) JSON-запроса в UTF-8, включая revision и document.
      Превышение лимита не сохраняет частичные изменения (400 от Go, 413 от reverse proxy).
    security:
      - session: []
        csrfCookie: []
        csrfHeader: []
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/schemas/SaveVersion'
    responses:
      '200':
        description: Успешно
        content:
          application/json:
            schema:
              $ref: '#/schemas/Version'
      '400':
        $ref: ./openapi.yaml#/components/responses/Error
      '401':
        $ref: ./openapi.yaml#/components/responses/Error
      '403':
        $ref: ./openapi.yaml#/components/responses/Error
      '404':
        $ref: ./openapi.yaml#/components/responses/Error
      '409':
        $ref: ./openapi.yaml#/components/responses/Error
      '500':
        $ref: ./openapi.yaml#/components/responses/Error
      '413':
        $ref: ./openapi.yaml#/components/responses/Error
actions:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    - name: version_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  post:
    tags:
      - M2 Program versions
    summary: Согласование версии
    description: >-
      draft → review → published → archived; review → draft с комментарием. Все решения сохраняются. Роли повторно
      проверяются в транзакции; самоутверждение запрещено.
    security:
      - session: []
        csrfCookie: []
        csrfHeader: []
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/schemas/VersionAction'
    responses:
      '200':
        description: Успешно
        content:
          application/json:
            schema:
              $ref: '#/schemas/Version'
      '400':
        $ref: ./openapi.yaml#/components/responses/Error
      '401':
        $ref: ./openapi.yaml#/components/responses/Error
      '403':
        $ref: ./openapi.yaml#/components/responses/Error
      '404':
        $ref: ./openapi.yaml#/components/responses/Error
      '409':
        $ref: ./openapi.yaml#/components/responses/Error
      '500':
        $ref: ./openapi.yaml#/components/responses/Error
transferPreview:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  post:
    tags:
      - M2 Program versions
    summary: Предварительный просмотр перевода группы
    description: >-
      Только admin. Цель — published активной программы. Включает только будущие scheduled-занятия без исторического
      снимка. Показывает прежний план, необходимость сопоставления и снятия старого модуля при смене программы.
      При смене программы выбранный модуль/шаблон требует ручного сопоставления даже при совпадении ключей:
      ключи уникальны только внутри документа.
    security:
      - session: []
        csrfCookie: []
        csrfHeader: []
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - target_version_id
            properties:
              target_version_id:
                type: integer
                format: int64
                minimum: 1
    responses:
      '200':
        description: Успешно
        content:
          application/json:
            schema:
              $ref: '#/schemas/Preview'
      '400':
        $ref: ./openapi.yaml#/components/responses/Error
      '401':
        $ref: ./openapi.yaml#/components/responses/Error
      '403':
        $ref: ./openapi.yaml#/components/responses/Error
      '404':
        $ref: ./openapi.yaml#/components/responses/Error
      '409':
        $ref: ./openapi.yaml#/components/responses/Error
      '500':
        $ref: ./openapi.yaml#/components/responses/Error
transfer:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  post:
    tags:
      - M2 Program versions
    summary: Перевести группу и будущие занятия
    description: >-
      Только admin. Требует актуальный preview_token, причину и полное сопоставление всех показанных занятий. Изменение
      списка, ревизии или публикационного статуса цели даёт 409. История, прежние планы и audit сохраняются атомарно.
      Прошлые/начавшиеся/проведённые/отменённые занятия не изменяются.
      Максимальный размер JSON-запроса с сопоставлениями — 1 МиБ (1048576 байт UTF-8).
    security:
      - session: []
        csrfCookie: []
        csrfHeader: []
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/schemas/TransferInput'
    responses:
      '200':
        description: Успешно
        content:
          application/json:
            schema:
              $ref: '#/schemas/TransferRecord'
      '400':
        $ref: ./openapi.yaml#/components/responses/Error
      '401':
        $ref: ./openapi.yaml#/components/responses/Error
      '403':
        $ref: ./openapi.yaml#/components/responses/Error
      '404':
        $ref: ./openapi.yaml#/components/responses/Error
      '409':
        $ref: ./openapi.yaml#/components/responses/Error
      '500':
        $ref: ./openapi.yaml#/components/responses/Error
      '413':
        $ref: ./openapi.yaml#/components/responses/Error
transfers:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  get:
    tags:
      - M2 Program versions
    summary: История переводов группы
    description: >-
      Только admin. Содержит сохранённые прежние и результирующие планы, причину, автора и время; порядок по ID
      убывающий.
    security:
      - session: []
    responses:
      '200':
        description: Успешно
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/schemas/TransferRecord'
      '400':
        $ref: ./openapi.yaml#/components/responses/Error
      '401':
        $ref: ./openapi.yaml#/components/responses/Error
      '403':
        $ref: ./openapi.yaml#/components/responses/Error
      '404':
        $ref: ./openapi.yaml#/components/responses/Error
      '409':
        $ref: ./openapi.yaml#/components/responses/Error
      '500':
        $ref: ./openapi.yaml#/components/responses/Error
schemas:
  Template:
    type: object
    additionalProperties: false
    required:
      - key
      - topic
      - goals
      - duration_minutes
      - outline
      - exercises
      - equipment
      - materials
      - criteria
    properties:
      key:
        type: string
        pattern: ^[a-zA-Z0-9_-]{1,80}$
      topic:
        type: string
        maxLength: 200
        minLength: 1
      goals:
        type: string
        maxLength: 20000
      duration_minutes:
        type: integer
        minimum: 1
        maximum: 1440
      outline:
        type: string
        maxLength: 20000
      exercises:
        type: string
        maxLength: 20000
      equipment:
        type: string
        maxLength: 20000
      materials:
        type: string
        maxLength: 20000
      criteria:
        type: string
        maxLength: 20000
      required:
        type: boolean
        default: false
        description: Обязательность элемента для расчёта прогресса группы; старые версии не дополняются задним числом.
      weight:
        type: integer
        nullable: true
        minimum: 1
        maximum: 1000
        description: Обязателен только для required=true; у необязательного элемента null или отсутствует.
  Module:
    type: object
    additionalProperties: false
    required:
      - key
      - name
      - description
      - lessons
    properties:
      key:
        type: string
        pattern: ^[a-zA-Z0-9_-]{1,80}$
      name:
        type: string
        maxLength: 200
        minLength: 1
      description:
        type: string
        maxLength: 5000
      lessons:
        type: array
        items:
          $ref: '#/schemas/Template'
  Section:
    type: object
    additionalProperties: false
    required:
      - key
      - name
      - modules
    properties:
      key:
        type: string
        pattern: ^[a-zA-Z0-9_-]{1,80}$
      name:
        type: string
        maxLength: 200
        minLength: 1
      modules:
        type: array
        items:
          $ref: '#/schemas/Module'
  Document:
    type: object
    additionalProperties: false
    required:
      - name
      - description
      - sections
    properties:
      name:
        type: string
        maxLength: 200
        minLength: 1
      description:
        type: string
        maxLength: 5000
      sections:
        type: array
        items:
          $ref: '#/schemas/Section'
        maxItems: 50
    description: >-
      Порядок массивов задаёт порядок обучения. Все ключи уникальны внутри версии и сохраняются при копировании. До 200
      модулей и 1000 шаблонов суммарно. В draft допустимы незаполненные текстовые поля. При submit/publish каждый раздел
      содержит модуль, каждый модуль — шаблон; все поля шаблона заполнены. Материалы — текст, загрузки файлов в M2 01
      нет.
  Event:
    type: object
    additionalProperties: false
    required:
      - id
      - actor_id
      - action
      - comment
      - created_at
    properties:
      id:
        type: integer
        format: int64
        minimum: 1
      actor_id:
        type: integer
        format: int64
        minimum: 1
        nullable: true
      action:
        type: string
        enum:
          - created
          - edited
          - submit
          - return
          - publish
          - archive
          - imported
      comment:
        type: string
        maxLength: 1000
      created_at:
        type: string
        format: date-time
  Version:
    type: object
    additionalProperties: false
    required:
      - id
      - program_id
      - number
      - status
      - document
      - revision
      - created_by
      - submitted_by
      - approved_by
      - source_version_id
      - legacy_import
      - created_at
      - updated_at
      - published_at
    properties:
      id:
        type: integer
        format: int64
        minimum: 1
      program_id:
        type: integer
        format: int64
        minimum: 1
      number:
        type: integer
        minimum: 1
      status:
        type: string
        enum:
          - draft
          - review
          - published
          - archived
      document:
        $ref: '#/schemas/Document'
      revision:
        type: integer
        minimum: 1
      created_by:
        type: integer
        format: int64
        minimum: 1
        nullable: true
      submitted_by:
        type: integer
        format: int64
        minimum: 1
        nullable: true
      approved_by:
        type: integer
        format: int64
        minimum: 1
        nullable: true
      source_version_id:
        type: integer
        format: int64
        minimum: 1
        nullable: true
      legacy_import:
        type: boolean
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      published_at:
        type: string
        format: date-time
        nullable: true
  VersionCard:
    type: object
    additionalProperties: false
    required:
      - id
      - program_id
      - number
      - status
      - document
      - revision
      - created_by
      - submitted_by
      - approved_by
      - source_version_id
      - legacy_import
      - created_at
      - updated_at
      - published_at
      - events
    properties:
      id:
        type: integer
        format: int64
        minimum: 1
      program_id:
        type: integer
        format: int64
        minimum: 1
      number:
        type: integer
        minimum: 1
      status:
        type: string
        enum:
          - draft
          - review
          - published
          - archived
      document:
        $ref: '#/schemas/Document'
      revision:
        type: integer
        minimum: 1
      created_by:
        type: integer
        format: int64
        minimum: 1
        nullable: true
      submitted_by:
        type: integer
        format: int64
        minimum: 1
        nullable: true
      approved_by:
        type: integer
        format: int64
        minimum: 1
        nullable: true
      source_version_id:
        type: integer
        format: int64
        minimum: 1
        nullable: true
      legacy_import:
        type: boolean
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      published_at:
        type: string
        format: date-time
        nullable: true
      events:
        type: array
        items:
          $ref: '#/schemas/Event'
  VersionPage:
    type: object
    additionalProperties: false
    required:
      - items
      - total
    properties:
      items:
        type: array
        items:
          $ref: '#/schemas/Version'
      total:
        type: integer
        minimum: 0
  CreateVersion:
    type: object
    additionalProperties: false
    properties:
      source_version_id:
        type: integer
        format: int64
        minimum: 1
        nullable: true
  SaveVersion:
    type: object
    additionalProperties: false
    required:
      - revision
      - document
    properties:
      revision:
        type: integer
        minimum: 1
      document:
        $ref: '#/schemas/Document'
  VersionAction:
    type: object
    additionalProperties: false
    required:
      - revision
      - action
    properties:
      revision:
        type: integer
        minimum: 1
      action:
        type: string
        enum:
          - submit
          - return
          - publish
          - archive
      comment:
        type: string
        maxLength: 1000
    description: >-
      return требует непустой комментарий. submit — methodologist; остальные действия — education_leader. Создатель,
      редактор и отправитель версии не могут её публиковать, даже совмещая роли. При устаревшей revision возвращается
      409.
  Mapping:
    type: object
    additionalProperties: false
    required:
      - lesson_id
      - version_module_key
      - template_key
    properties:
      lesson_id:
        type: integer
        format: int64
        minimum: 1
      version_module_key:
        type: string
        maxLength: 80
      template_key:
        type: string
        maxLength: 80
    description: >-
      Пустые ключи означают явно выбранный план без шаблона. Непустой ключ шаблона должен принадлежать модулю целевой
      версии.
  PlanSnapshot:
    type: object
    additionalProperties: false
    required:
      - origin
    properties:
      origin:
        type: string
        enum:
          - version
          - core_import
          - legacy_unknown
      program_name:
        type: string
        maxLength: 200
      version_id:
        type: integer
        format: int64
        minimum: 1
      version_number:
        type: integer
      section_name:
        type: string
        maxLength: 200
      module_name:
        type: string
        maxLength: 200
      template:
        $ref: '#/schemas/Template'
      topic:
        type: string
        maxLength: 200
  AffectedLesson:
    type: object
    additionalProperties: false
    required:
      - id
      - topic
      - starts_at
      - updated_at
      - program_version_id
      - module_id
      - version_module_key
      - template_key
      - plan_snapshot
      - suggested
      - needs_mapping
      - clears_legacy_module
    properties:
      id:
        type: integer
        format: int64
        minimum: 1
      topic:
        type: string
        maxLength: 200
      starts_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      program_version_id:
        type: integer
        format: int64
        minimum: 1
      module_id:
        type: integer
        format: int64
        minimum: 1
        nullable: true
      version_module_key:
        type: string
        maxLength: 80
      template_key:
        type: string
        maxLength: 80
      plan_snapshot:
        $ref: '#/schemas/PlanSnapshot'
      suggested:
        $ref: '#/schemas/Mapping'
      needs_mapping:
        type: boolean
        description: Нет соответствия в целевом документе либо меняется программа занятия с выбранным модулем/шаблоном. Требуется явный выбор пользователя.
      clears_legacy_module:
        type: boolean
  Preview:
    type: object
    additionalProperties: false
    required:
      - group_id
      - group_updated_at
      - previous_version_id
      - target
      - lessons
      - preview_token
    properties:
      group_id:
        type: integer
        format: int64
        minimum: 1
      group_updated_at:
        type: string
        format: date-time
      previous_version_id:
        type: integer
        format: int64
        minimum: 1
      target:
        $ref: '#/schemas/Version'
      lessons:
        type: array
        items:
          $ref: '#/schemas/AffectedLesson'
      preview_token:
        type: string
        minLength: 64
        maxLength: 64
  TransferInput:
    type: object
    additionalProperties: false
    required:
      - target_version_id
      - preview_token
      - reason
      - mappings
    properties:
      target_version_id:
        type: integer
        format: int64
        minimum: 1
      preview_token:
        type: string
        minLength: 64
        maxLength: 64
      reason:
        type: string
        maxLength: 1000
        minLength: 1
      mappings:
        type: array
        items:
          $ref: '#/schemas/Mapping'
  TransferRecord:
    type: object
    additionalProperties: false
    required:
      - id
      - actor_id
      - previous_version_id
      - target_version_id
      - reason
      - previous_lessons
      - resulting_lessons
      - created_at
    properties:
      id:
        type: integer
        format: int64
        minimum: 1
      actor_id:
        type: integer
        format: int64
        minimum: 1
      previous_version_id:
        type: integer
        format: int64
        minimum: 1
      target_version_id:
        type: integer
        format: int64
        minimum: 1
      reason:
        type: string
        maxLength: 1000
      previous_lessons:
        type: array
        items:
          $ref: '#/schemas/AffectedLesson'
      resulting_lessons:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - id
            - program_version_id
            - module_id
            - version_module_key
            - template_key
            - topic
            - plan_snapshot
          properties:
            id:
              type: integer
              format: int64
              minimum: 1
            program_version_id:
              type: integer
              format: int64
              minimum: 1
            module_id:
              type: integer
