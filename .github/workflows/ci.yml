name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: aiq_test
          POSTGRES_USER: aiq
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiq -d aiq_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://aiq:ci-only-password@localhost:5432/aiq_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: backend/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/server ./cmd/admin
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
