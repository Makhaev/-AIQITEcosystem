name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: aiq_test
          POSTGRES_USER: aiq
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiq -d aiq_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://aiq:ci-only-password@localhost:5432/aiq_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: backend/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/server ./cmd/admin
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  pilot-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: aiq_pilot
          POSTGRES_USER: aiq
          POSTGRES_PASSWORD: ci-only-pilot-database
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aiq -d aiq_pilot"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://aiq:ci-only-pilot-database@localhost:5432/aiq_pilot?sslmode=disable
      HTTP_ADDR: 127.0.0.1:8081
      APP_ORIGIN: http://127.0.0.1:5175
      AIQ_API_TARGET: http://127.0.0.1:8081
      PILOT_BASE_URL: http://127.0.0.1:5175
      ADMIN_EMAIL: admin@pilot.test
      ADMIN_NAME: Pilot Acceptance
      ADMIN_PASSWORD: CI-Only-Pilot-Bootstrap-2026
      PILOT_ADMIN_EMAIL: admin@pilot.test
      PILOT_ADMIN_PASSWORD: CI-Only-Pilot-Bootstrap-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mkdir -p ../.cache && go build -o ../.cache/pilot-server ./cmd/server && go run ./cmd/admin
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start isolated acceptance servers
        run: |
          mkdir -p .cache
          env -u ADMIN_PASSWORD -u PILOT_ADMIN_PASSWORD .cache/pilot-server >.cache/acceptance-backend.log 2>&1 &
          (cd frontend && env -u ADMIN_PASSWORD -u PILOT_ADMIN_PASSWORD node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5175 --strictPort >../.cache/acceptance-frontend.log 2>&1) &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5175/health/ready; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: node node_modules/@playwright/test/cli.js test --config playwright.live.config.ts
        working-directory: frontend
