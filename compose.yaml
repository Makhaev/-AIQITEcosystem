name: aiq-core
services:
  db:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: aiq
      POSTGRES_USER: aiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiq -d aiq"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://aiq:${POSTGRES_PASSWORD}@db:5432/aiq?sslmode=disable
      HTTP_ADDR: :8080
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: "true"
      EVENT_SELF_REGISTRATION_MIN_AGE: ${EVENT_SELF_REGISTRATION_MIN_AGE:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
  migrate:
    build: ./backend
    profiles: ["maintenance"]
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://aiq:${POSTGRES_PASSWORD}@db:5432/aiq?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  admin:
    build: ./backend
    profiles: ["maintenance"]
    entrypoint: ["/app/admin"]
    environment:
      DATABASE_URL: postgres://aiq:${POSTGRES_PASSWORD}@db:5432/aiq?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
