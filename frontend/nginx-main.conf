user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
# Native diagnostics may contain client addresses or request URLs. Request
# failures are recorded by the structured access log in nginx.conf instead.
error_log /dev/null;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
