root /usr/share/nginx/html;
index index.html;
# Attendance accepts up to 1 MiB; Go enforces each endpoint's own limit.
client_max_body_size 1m;
access_log /dev/stdout aiq_json;
# Native nginx diagnostics may contain client IPs and request URLs.
error_log /dev/null;
add_header X-Request-ID $aiq_request_id always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;

location /api/ {
    proxy_pass http://backend:8080;
    proxy_hide_header X-Request-ID;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
}
location /health/ {
    proxy_pass http://backend:8080;
    proxy_hide_header X-Request-ID;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
}
error_page 413 = @payload_too_large;
error_page 502 503 504 = @backend_unavailable;
location @payload_too_large {
    default_type application/json;
    return 413 '{"code":"payload_too_large","message":"Размер запроса превышает допустимый.","field_errors":{},"request_id":"$aiq_request_id"}';
}
location @backend_unavailable {
    default_type application/json;
    return 503 '{"code":"unavailable","message":"Сервис временно недоступен.","field_errors":{},"request_id":"$aiq_request_id"}';
}
location /assets/ { try_files $uri =404; }
location / { try_files $uri /index.html; }
