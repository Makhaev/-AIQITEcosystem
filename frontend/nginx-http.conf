# Do not include client addresses, URLs, query strings, headers or cookies.
log_format aiq_json escape=json '{"time":"$time_iso8601","level":"INFO","message":"http","request_id":"$aiq_request_id","status":$status,"duration_seconds":$request_time}';
map $upstream_http_x_request_id $aiq_request_id {
    "" $request_id;
    default $upstream_http_x_request_id;
}
